# pytest settings for 8_multimodal. Run from the repo root:  .venv/bin/python -m pytest 8_multimodal/tests
# Offline: every model is faked. The Mermaid parser tests need node (skipped without it).
[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
